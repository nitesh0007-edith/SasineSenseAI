<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">SasineSense AI architecture</title><desc id="desc">Layered document intelligence architecture from upload through human review.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10253b"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8da8c7"/></marker></defs>
<rect width="1600" height="760" rx="28" fill="url(#bg)"/><text x="80" y="92" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="38" font-weight="700">SasineSense AI</text><text x="80" y="132" fill="#a9c1dc" font-family="Arial,sans-serif" font-size="19">Evidence-first intelligence for historical Scottish property records</text><rect x="80" y="178" width="1440" height="2" fill="#24425e"/>
<g font-family="Arial,sans-serif"><g fill="#173450" stroke="#3d678f"><rect x="80" y="245" width="210" height="112" rx="18"/><rect x="350" y="245" width="210" height="112" rx="18"/><rect x="620" y="245" width="210" height="112" rx="18"/><rect x="890" y="245" width="210" height="112" rx="18"/><rect x="1160" y="245" width="210" height="112" rx="18"/></g><g text-anchor="middle"><text x="185" y="287" fill="#7aa7ff" font-size="15" font-weight="700">01 · INGEST</text><text x="185" y="319" fill="#fff" font-size="19">PDF / image</text><text x="185" y="344" fill="#a9c1dc" font-size="14">validation + storage</text><text x="455" y="287" fill="#7aa7ff" font-size="15" font-weight="700">02 · PREPARE</text><text x="455" y="319" fill="#fff" font-size="19">Render + enhance</text><text x="455" y="344" fill="#a9c1dc" font-size="14">non-destructive pages</text><text x="725" y="287" fill="#55d6be" font-size="15" font-weight="700">03 · OBSERVE</text><text x="725" y="319" fill="#fff" font-size="19">OCR + NER</text><text x="725" y="344" fill="#a9c1dc" font-size="14">text, tokens, entities</text><text x="995" y="287" fill="#55d6be" font-size="15" font-weight="700">04 · EXTRACT</text><text x="995" y="319" fill="#fff" font-size="19">Rules + VLM</text><text x="995" y="344" fill="#a9c1dc" font-size="14">schema-constrained fields</text><text x="1265" y="287" fill="#55d6be" font-size="15" font-weight="700">05 · ASSURE</text><text x="1265" y="319" fill="#fff" font-size="19">Validate + resolve</text><text x="1265" y="344" fill="#a9c1dc" font-size="14">confidence + places</text></g>
<g fill="#1b3d44" stroke="#55d6be"><rect x="485" y="500" width="260" height="112" rx="18"/><rect x="855" y="500" width="260" height="112" rx="18"/></g><g text-anchor="middle"><text x="615" y="542" fill="#55d6be" font-size="15" font-weight="700">06 · REVIEW</text><text x="615" y="574" fill="#fff" font-size="19">Human-in-the-loop</text><text x="615" y="599" fill="#b9ded8" font-size="14">accept · edit · flag</text><text x="985" y="542" fill="#55d6be" font-size="15" font-weight="700">07 · PERSIST</text><text x="985" y="574" fill="#fff" font-size="19">Provenance + audit</text><text x="985" y="599" fill="#b9ded8" font-size="14">SQLite / Postgres-ready</text></g></g>
<g stroke="#8da8c7" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M290 301h55"/><path d="M560 301h55"/><path d="M830 301h55"/><path d="M1100 301h55"/><path d="M1265 357v92H985v45"/><path d="M855 556H745"/></g><text x="80" y="704" fill="#7e9ab8" font-family="Arial,sans-serif" font-size="16">Every candidate retains evidence, method, page, confidence and validation state.</text>
</svg>
