<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Reviewer workflow</title><desc id="desc">A reviewer sees evidence, makes a decision, and an append-only audit log records it.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf7f4"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#54708c"/></marker></defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)" stroke="#d7e6ef" stroke-width="2"/><text x="60" y="70" fill="#102b46" font-family="Arial,sans-serif" font-size="28" font-weight="700">A reviewable answer, not a black box</text>
<g font-family="Arial,sans-serif"><g fill="#fff" stroke-width="2"><rect x="70" y="140" width="280" height="170" rx="18" stroke="#9bbbd0"/><rect x="460" y="140" width="280" height="170" rx="18" stroke="#8bcfbe"/><rect x="850" y="140" width="280" height="170" rx="18" stroke="#9bbbd0"/></g><text x="210" y="180" text-anchor="middle" fill="#2c6c83" font-size="15" font-weight="700">EVIDENCE PANEL</text><text x="95" y="220" fill="#18334d" font-size="17">Document date · 1894</text><text x="95" y="250" fill="#54708c" font-size="15">p. 1 · “twenty third day…”</text><text x="95" y="280" fill="#54708c" font-size="15">confidence 0.91 · rules + VLM</text><text x="600" y="180" text-anchor="middle" fill="#16866f" font-size="15" font-weight="700">REVIEW DECISION</text><text x="485" y="220" fill="#18334d" font-size="17">Accept</text><text x="485" y="250" fill="#18334d" font-size="17">Edit</text><text x="485" y="280" fill="#18334d" font-size="17">Flag / unresolved</text><text x="990" y="180" text-anchor="middle" fill="#2c6c83" font-size="15" font-weight="700">APPEND-ONLY AUDIT</text><text x="875" y="220" fill="#18334d" font-size="17">who · when · what</text><text x="875" y="250" fill="#54708c" font-size="15">previous → new value</text><text x="875" y="280" fill="#54708c" font-size="15">history is never deleted</text></g><g stroke="#54708c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M350 225h100"/><path d="M740 225h100"/></g>
</svg>
